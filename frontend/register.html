<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShopEase | Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<nav class="navbar border-bottom">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html">
            ShopEase
        </a>


        <a
            href="login.html"
            class="btn btn-outline-primary">
            Login
        </a>

    </div>

</nav>



<main class="container">

    <div class="card form-card shadow-sm">

        <div class="card-body">

            <div class="text-center mb-4">

                <h2 class="fw-bold">
                    Create Your Account
                </h2>

                <p class="text-muted">
                    Join ShopEase and start shopping.
                </p>

            </div>



            <!-- PHASE 4 WILL CONNECT THIS FORM -->

            <form
                id="registerForm"
                action="#"
                method="POST">


                <div class="mb-3">

                    <label
                        for="name"
                        class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>



                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>



                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>



                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Create Account

                </button>


            </form>


            <!-- PHASE 4 SUCCESS/ERROR MESSAGE -->

            <div
                id="formMessage"
                class="mt-3">
            </div>



            <p class="text-center text-muted mt-4 mb-0">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</main>



<footer class="py-4">

    <div class="container text-center">

        <p class="mb-0">
            ShopEase | Stationery and Study Essentials
        </p>

    </div>

</footer>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- PHASE 4 JAVASCRIPT -->

<script src="js/register.js"></script>


</body>

</html>
