<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ShopEase</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link" href="cart.html">Cart</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <a href="products.html" class="text-decoration-none">&larr; Back to Products</a>

        <div class="row g-5 mt-3 align-items-center">
            <div class="col-md-5">
                <div class="card p-5 text-center">
                    <h1 style="font-size: 120px;">📓</h1>
                </div>
            </div>

            <div class="col-md-7">
                <h1 class="fw-bold">Notebook</h1>
                <p class="text-muted">School Supplies</p>
                <h3 class="fw-bold text-primary">₱50.00</h3>

                <p class="mt-4">
                    A handy notebook for taking notes, writing assignments,
                    and organizing your everyday school activities.
                </p>

                <p><strong>Availability:</strong> In Stock</p>

                <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity</label>
                    <input type="number" id="quantity" name="quantity"
                        class="form-control" value="1" min="1">
                </div>

                <button type="button" class="btn btn-primary">
                    Add to Cart
                </button>

                <a href="cart.html" class="btn btn-outline-primary ms-2">
                    View Cart
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 ShopEase. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
