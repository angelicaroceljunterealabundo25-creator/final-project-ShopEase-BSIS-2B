<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | ShopEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            ShopEase
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cart.html">
                        Cart
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>


<!-- PRODUCT DETAILS -->
<main class="container py-5">

    <a href="products.html"
       class="text-decoration-none">
        ← Back to Products
    </a>


    <div class="row justify-content-center mt-4">

        <div class="col-lg-10">

            <div class="card shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <div class="row align-items-center">

                        <!-- IMAGE -->
                        <div class="col-md-5 text-center mb-4 mb-md-0">

                            <div class="product-image p-5">

                                <div class="product-icon">

                                    <span style="font-size: 80px;">
                                        📓
                                    </span>

                                </div>

                            </div>

                        </div>


                        <!-- INFORMATION -->
                        <div class="col-md-7">

                            <span class="badge text-bg-light mb-2">
                                School Supplies
                            </span>

                            <h2 class="fw-bold mb-3">
                                Notebook
                            </h2>

                            <h3 class="product-price fw-bold mb-3">
                                ₱50
                            </h3>

                            <p class="text-muted">
                                A simple and useful notebook for students,
                                teachers, and everyday school activities.
                            </p>

                            <p>
                                <strong>Availability:</strong>

                                <span class="text-success">
                                    In Stock
                                </span>
                            </p>


                            <!-- QUANTITY -->
                            <div class="mb-3">

                                <label for="quantity"
                                       class="form-label">
                                    Quantity
                                </label>

                                <input type="number"
                                       id="quantity"
                                       class="form-control"
                                       value="1"
                                       min="1"
                                       style="max-width: 120px;">

                            </div>


                            <!-- BUTTONS -->
                            <div class="d-flex gap-2 flex-wrap">

                                <button type="button"
                                        class="btn btn-primary">
                                    Add to Cart
                                </button>

                                <a href="cart.html"
                                   class="btn btn-outline-primary">
                                    View Cart
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">

    <div class="container">

        <p class="mb-0">
            &copy; 2026 ShopEase. All rights reserved.
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
