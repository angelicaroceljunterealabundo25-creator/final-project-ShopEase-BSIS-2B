<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShopEase | Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<nav class="navbar border-bottom">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html">
            ShopEase
        </a>

        <a
            href="register.html"
            class="btn btn-outline-primary">
            Register
        </a>

    </div>

</nav>



<main class="container">

    <div class="card form-card shadow-sm">

        <div class="card-body">

            <div class="text-center mb-4">

                <h2 class="fw-bold">
                    Welcome Back
                </h2>

                <p class="text-muted">
                    Login to your ShopEase account.
                </p>

            </div>


            <form
                action="#"
                method="POST">


                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>



                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>



                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Login

                </button>


            </form>


            <p class="text-center text-muted mt-4 mb-0">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>

        </div>

    </div>

</main>



<footer class="py-4">

    <div class="container text-center">

        <p class="mb-0">
            ShopEase | Stationery and Study Essentials
        </p>

    </div>

</footer>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
