<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ShopEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            ShopEase
        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="cart.html">
                        Cart
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- CHECKOUT -->
<main class="container py-5">

    <div class="text-center mb-5">

        <h2 class="fw-bold">
            Checkout
        </h2>

        <p class="text-muted">
            Complete your order details below.
        </p>

    </div>


    <div class="row g-4">

        <!-- CUSTOMER INFORMATION -->
        <div class="col-lg-7">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h5 class="fw-bold mb-4">
                        Customer Information
                    </h5>


                    <form>

                        <div class="mb-3">

                            <label for="name"
                                   class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   id="name"
                                   class="form-control"
                                   placeholder="Enter your full name">

                        </div>


                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   id="email"
                                   class="form-control"
                                   placeholder="Enter your email">

                        </div>


                        <div class="mb-3">

                            <label for="contact"
                                   class="form-label">
                                Contact Number
                            </label>

                            <input type="text"
                                   id="contact"
                                   class="form-control"
                                   placeholder="Enter your contact number">

                        </div>


                        <div class="mb-3">

                            <label for="address"
                                   class="form-label">
                                Delivery Address
                            </label>

                            <textarea id="address"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Enter your delivery address"></textarea>

                        </div>


                        <div class="mb-3">

                            <label for="payment"
                                   class="form-label">
                                Payment Method
                            </label>

                            <select id="payment"
                                    class="form-select">

                                <option selected>
                                    Cash on Delivery
                                </option>

                                <option>
                                    GCash
                                </option>

                                <option>
                                    Bank Transfer
                                </option>

                            </select>

                        </div>

                    </form>


                </div>

            </div>

        </div>


        <!-- ORDER SUMMARY -->
        <div class="col-lg-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h5 class="fw-bold mb-4">
                        Order Summary
                    </h5>


                    <div class="d-flex justify-content-between mb-2">

                        <span>
                            Notebook
                        </span>

                        <span>
                            ₱50
                        </span>

                    </div>


                    <div class="d-flex justify-content-between mb-2">

                        <span>
                            Pencil Set
                        </span>

                        <span>
                            ₱35
                        </span>

                    </div>


                    <hr>


                    <div class="d-flex justify-content-between mb-4">

                        <strong>
                            Total
                        </strong>

                        <strong class="product-price">
                            ₱85
                        </strong>

                    </div>


                    <button type="button"
                            class="btn btn-primary w-100">
                        Place Order
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">

    <div class="container">

        <p class="mb-0">
            &copy; 2026 ShopEase. All rights reserved.
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
