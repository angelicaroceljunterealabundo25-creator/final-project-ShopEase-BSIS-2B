
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ShopEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            ShopEase
        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="cart.html">
                        Cart
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- CHECKOUT -->
<main class="container py-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold">Checkout</h2>
        <p class="text-muted">Complete your order details below.</p>
    </div>
    <div class="row g-4">
        <div class="col-md-7">
            <div class="card shadow-sm p-4">
                <form id="checkoutForm" action="#" method="POST">
                    <div class="mb-3"><label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" name="fullName" readonly></div>
                    <div class="mb-3"><label for="address" class="form-label">Delivery Address</label>
                        <textarea class="form-control" id="address" name="address" rows="3" required placeholder="Building / Room / Campus pickup point"></textarea></div>
                    <div class="mb-3"><label for="paymentMethod" class="form-label">Payment Method</label>
                        <select class="form-select" id="paymentMethod" name="paymentMethod">
                            <option>Cash on Delivery</option><option>GCash</option><option>Pay at Pickup</option>
                        </select></div>
                    <button type="submit" id="placeOrder" class="btn btn-primary w-100">Place Order</button>
                </form>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <h5 class="fw-bold mb-3">Order Summary</h5>
                <ul class="list-group mb-3" id="orderSummary"></ul>
                <h5>Total: <span id="orderTotal">₱0</span></h5>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">

    <div class="container">

        <p class="mb-0">
            &copy; 2026 ShopEase. All rights reserved.
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/checkout.js"></script>

</body>
</html>
