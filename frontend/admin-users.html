<!-- USERS -->
<main class="container py-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold">Manage Users</h2>
        <p class="text-muted">View, edit, and delete registered ShopEase users.</p>
    </div>
    <input type="text" id="search" class="form-control mb-3" placeholder="Search users by name or email...">
    <div class="card shadow-sm"><div class="card-body"><div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead><tr><th>User ID</th><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Action</th></tr></thead>
            <tbody id="userTableBody"><tr><td colspan="6" class="text-center text-muted">Loading...</td></tr></tbody>
        </table>
    </div></div></div>
</main>
<!-- EDIT USER MODAL -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <form id="editForm">
      <div class="modal-header"><h5 class="modal-title">Edit User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="mb-3"><label for="editName" class="form-label">Name</label>
          <input type="text" id="editName" class="form-control" required></div>
        <div class="mb-3"><label for="editEmail" class="form-label">Email</label>
          <input type="email" id="editEmail" class="form-control" required></div>
        <div class="mb-3"><label for="editRole" class="form-label">Role</label>
          <select id="editRole" class="form-select">
            <option value="customer">Customer</option><option value="staff">Staff</option><option value="admin">Admin</option>
          </select></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div></div>
</div>

<!-- DELETE CONFIRMATION MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Delete User</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">Are you sure you want to delete <strong id="deleteName"></strong>?</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
    </div>
  </div></div>
</div>
