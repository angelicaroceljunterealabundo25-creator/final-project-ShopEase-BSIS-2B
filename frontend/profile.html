<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShopEase | Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<nav class="navbar border-bottom">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html">
            ShopEase
        </a>


        <div>

            <a
                href="dashboard.html"
                class="btn btn-outline-primary me-2">
                Products
            </a>

            <a
                href="cart.html"
                class="btn btn-outline-secondary">
                Cart
            </a>

        </div>

    </div>

</nav>



<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card profile-card shadow-sm">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <div
                            class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                            style="width: 80px; height: 80px;">

                            <span class="fs-3">
                                U
                            </span>

                        </div>


                        <h2 class="fw-bold mt-3">
                            My Profile
                        </h2>

                        <p class="text-muted">
                            Manage your ShopEase account.
                        </p>

                    </div>



                    <form>

                        <div class="mb-3">

                            <label
                                for="profileName"
                                class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="profileName"
                                name="name"
                                placeholder="Enter your full name">

                        </div>



                        <div class="mb-3">

                            <label
                                for="profileEmail"
                                class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="profileEmail"
                                name="email"
                                placeholder="Enter your email">

                        </div>



                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Update Profile

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>



<footer class="py-4">

    <div class="container text-center">

        <p class="mb-0">
            ShopEase | Stationery and Study Essentials
        </p>

    </div>

</footer>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
