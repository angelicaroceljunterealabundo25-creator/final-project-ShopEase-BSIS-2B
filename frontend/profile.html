<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | ShopEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            ShopEase
        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="orders.html">
                        My Orders
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       href="profile.html">
                        Profile
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- PROFILE -->
<main class="container py-5">

    <div class="text-center mb-4">

        <h2 class="fw-bold">
            My Profile
        </h2>

        <p class="text-muted">
            Manage your ShopEase account information.
        </p>

    </div>


    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <div class="product-icon d-inline-block">

                            <span style="font-size: 60px;">
                                👤
                            </span>

                        </div>

                        <h5 class="fw-bold mt-3">
                            Customer Account
                        </h5>

                    </div>


                    <form>

                        <div class="mb-3">

                            <label for="fullName"
                                   class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="fullName"
                                   placeholder="Enter your full name">

                        </div>


                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   placeholder="Enter your email">

                        </div>


                        <div class="mb-3">

                            <label for="contact"
                                   class="form-label">
                                Contact Number
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="contact"
                                   placeholder="Enter your contact number">

                        </div>


                        <div class="mb-3">

                            <label for="address"
                                   class="form-label">
                                Address
                            </label>

                            <textarea class="form-control"
                                      id="address"
                                      rows="3"
                                      placeholder="Enter your address"></textarea>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">
                            Update Profile
                        </button>

                    </form>
                    <form action="#" method="POST">
                        <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Enter your full name">
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email">
                        <input type="text" class="form-control" id="contact" name="contact" placeholder="Enter your contact number">
                        <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter your address"></textarea>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">

    <div class="container">

        <p class="mb-0">
            &copy; 2026 ShopEase. All rights reserved.
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
