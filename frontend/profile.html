<!-- PROFILE -->
<main class="container py-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold">My Profile</h2>
        <p class="text-muted">Manage your ShopEase account information.</p>
    </div>
    <div class="row g-4 justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h5 class="fw-bold mb-3">Account Information <span class="badge text-bg-secondary text-capitalize" id="profileRole"></span></h5>
                <form id="profileForm" action="#" method="POST">
                    <div class="mb-3"><label for="profileName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="profileName" name="name" required></div>
                    <div class="mb-3"><label for="profileEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="profileEmail" name="email" required></div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h5 class="fw-bold mb-3">Change Password</h5>
                <form id="passwordForm" action="#" method="POST">
                    <div class="mb-3"><label for="newPassword" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" required></div>
                    <div class="mb-3"><label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirmNewPassword" name="confirmNewPassword" required></div>
                    <button type="submit" class="btn btn-primary">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</main>
