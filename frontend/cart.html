<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | ShopEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">
            ShopEase
        </a>


        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       href="cart.html">
                        Cart
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="orders.html">
                        My Orders
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- CART -->
<main class="container py-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold">Shopping Cart</h2>
        <p class="text-muted">Review your selected items before checkout.</p>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr></thead>
                    <tbody id="cartItems"></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Total: <span id="cartTotal">₱0</span></h5>
                <div>
                    <a href="products.html" class="btn btn-outline-primary">Continue Shopping</a>
                    <a href="checkout.html" id="checkoutBtn" class="btn btn-primary">Checkout</a>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">

    <div class="container">

        <p class="mb-0">
            &copy; 2026 ShopEase. All rights reserved.
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
