<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ShopEase</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="products.html">Products</a>
                <a class="nav-link active" href="cart.html">Cart</a>
                <a class="nav-link" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="fw-bold mb-4">Shopping Cart</h1>

        <div class="card p-4">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>📓 Notebook</td>
                            <td>₱50.00</td>
                            <td>
                                <input type="number" class="form-control"
                                    value="1" min="1" style="width: 80px;">
                            </td>
                            <td>₱50.00</td>
                        </tr>
                        <tr>
                            <td>✏️ Pencil Set</td>
                            <td>₱35.00</td>
                            <td>
                                <input type="number" class="form-control"
                                    value="1" min="1" style="width: 80px;">
                            </td>
                            <td>₱35.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="text-end mt-3">
                <h4>Total: ₱85.00</h4>
                <a href="products.html" class="btn btn-outline-primary mt-2">
                    Continue Shopping
                </a>
                <a href="checkout.html" class="btn btn-primary mt-2">
                    Proceed to Checkout
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 ShopEase. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
