<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold text-white" href="dashboard.html">ShopEase Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-products.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-users.html">Users</a></li>
                <li class="nav-item"><a class="nav-link" href="admin-reports.html">Reports</a></li>
                <li class="nav-item"><a class="nav-link" href="staff-orders.html">Orders</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html">Visit Store</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold">Dashboard</h2>
        <p class="text-muted">Overview of the ShopEase store.</p>
    </div>
    <div class="row g-4 mb-4">
        <div class="col-6 col-md-3"><div class="card shadow-sm text-center p-3"><h6 class="text-muted">Products</h6><h3 class="fw-bold" id="statProducts">…</h3></div></div>
        <div class="col-6 col-md-3"><div class="card shadow-sm text-center p-3"><h6 class="text-muted">Orders</h6><h3 class="fw-bold" id="statOrders">…</h3></div></div>
        <div class="col-6 col-md-3"><div class="card shadow-sm text-center p-3"><h6 class="text-muted">Users</h6><h3 class="fw-bold" id="statUsers">…</h3></div></div>
        <div class="col-6 col-md-3"><div class="card shadow-sm text-center p-3"><h6 class="text-muted">Low stock (≤5)</h6><h3 class="fw-bold" id="statLow">…</h3></div></div>
    </div>
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card shadow-sm"><div class="card-body">
                <h5 class="fw-bold mb-3">Recent Orders</h5>
                <div class="table-responsive"><table class="table align-middle">
                    <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead>
                    <tbody id="recentOrders"></tbody>
                </table></div>
            </div></div>
        </div>
        <div class="col-lg-5">
            <h5 class="fw-bold mb-3">Registered Users</h5>
            <div class="container" id="userList"></div>
        </div>
    </div>
</main>
<footer class="bg-dark text-white text-center py-3"><div class="container"><p class="mb-0">&copy; 2026 ShopEase Admin Dashboard.</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
